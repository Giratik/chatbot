services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-backend
    volumes:
      - /home/paulvidouze/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://10.75.12.5:11434
      - CONTEXT_SIZE=22000
      - TEMPERATURE=0.4
      - DEFAULT_LLM=gemma4:e4b
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - HF_HOME=/root/.cache/huggingface
      - EMBEDDING_MODEL=embeddinggemma:latest
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CHATBOT_ROLE=general
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default
      - qdrant_net   # ← rejoint le réseau Qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot-frontend
    ports:
      - "8501:8501"
    environment:
      # ← nom de service Docker, pas localhost
      - API_URL=http://backend:8000
      - STREAMLIT_BROWSER_SERVER_ADDRESS=10.75.12.5
      - CONTEXT_SIZE=22000
      - TEMPERATURE=0.4
      - DEFAULT_LLM=gemma4:e4b
      - DEFAULT_VLM=gemma4:e4b
      - TOOL_LLM=qwen3.5:4b
      - PAYLOAD_DEBUG=hide
      - IS_DEV=yes
    depends_on:
      - backend
      
networks:
  default: {}
  qdrant_net:
    external: true